name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - uses: taiki-e/install-action@nextest
      - name: Product gate
        run: python experiments/gate.py --tag ci --out ci-artifacts/gate
      - name: Hello contract check
        run: cargo run --quiet -- check examples/hello.bla
      - name: Collect failure evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cp -r examples/todo/.blabla ci-artifacts/todo-blabla 2>/dev/null || true
          cp -r examples/glyph-vault/.blabla ci-artifacts/glyph-blabla 2>/dev/null || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-${{ matrix.os }}
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: ignore
