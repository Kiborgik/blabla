name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            test_threads: 1
          - os: ubuntu-latest
            test_threads: 4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Product gate
        run: python experiments/gate.py --tag ci --out ci-artifacts/gate
        env:
          RUST_TEST_THREADS: ${{ matrix.test_threads }}
      - name: Examples acceptance
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cargo run --quiet -- check examples/hello.bla
          cargo run --quiet -- finish --project examples/todo --json > ci-artifacts/todo-finish.json
      - name: Collect failure evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cp -r examples/todo/.blabla ci-artifacts/todo-blabla 2>/dev/null || true
          cp -r examples/glyph-vault/.blabla ci-artifacts/glyph-blabla 2>/dev/null || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-${{ matrix.os }}
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: ignore

  research:
    name: research gate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - name: Research gate (stress and scorer; Glyph baselines are local-only evidence)
        run: python experiments/research_gate.py --tag ci --out ci-artifacts/research --skip-glyph
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-evidence
          path: ci-artifacts/research
          retention-days: 14
          if-no-files-found: ignore
