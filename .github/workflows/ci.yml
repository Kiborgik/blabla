name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            test_threads: 1
          - os: ubuntu-latest
            test_threads: 4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - name: Test
        run: cargo test
        env:
          RUST_TEST_THREADS: ${{ matrix.test_threads }}
      - run: python -m unittest discover -s examples/todo -p "test_*.py"
      - run: python -m unittest discover -s experiments -p "test_*.py"
      - name: Public tree audit
        run: python experiments/audit_public_tree.py --out ci-artifacts/public-tree-audit.json
      - run: python experiments/render_diagrams.py --check
      - name: Examples acceptance
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cargo run --quiet -- check examples/hello.bla
          cargo run --quiet -- finish --project examples/todo --json > ci-artifacts/todo-finish.json
      - name: Collect failure evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cp -r examples/todo/.blabla ci-artifacts/todo-blabla 2>/dev/null || true
          cp -r examples/glyph-vault/.blabla ci-artifacts/glyph-blabla 2>/dev/null || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-${{ matrix.os }}
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: ignore
