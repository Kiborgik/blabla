name: False GREEN
description: BlaBla reported GREEN while declared behavior or structure was actually violated
title: "[false-green] "
labels: ["false-green", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most valuable class of issue in this project. A false GREEN means the completion
        gate approved work that violates its own contract, which defeats the entire point of the tool.

        A campaign that reports YELLOW, ERROR, STALE or RED is not a false GREEN — it is BlaBla
        refusing to certify something, which is the intended behavior. Please open a bug report
        instead if that is what you are seeing.
  - type: textarea
    id: contract
    attributes:
      label: Contract
      description: The `.bla` contract, or the smallest part of it that still shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: Which declared rule was violated, and why it should have been RED.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What BlaBla reported. Paste the `blabla status` or `blabla finish` output, or the `--json` report.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        A minimal project if you can make one: the contract, the application or adapter, and the
        exact commands. A link to a repository is fine.
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Verification profile
      description: The `verify behavior { ... }` block, or the `blabla run` flags you used.
      placeholder: seed 0, cases 16, steps 32, timeout_ms 1000, shrink_budget 256
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed
      description: The seed the campaign ran with. Say so if the result varies between seeds.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BlaBla version
      description: Output of `blabla --version`, or the commit you built.
      placeholder: blabla 0.9.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, Rust toolchain and Python version.
      placeholder: Windows 11, rustc 1.9x stable, Python 3.12
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Whether the adapter is trusted, whether the application is deterministic, anything unusual.
