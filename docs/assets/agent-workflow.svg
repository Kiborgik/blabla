<svg id="my-svg" width="702.34375" height="723.0" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="background-color: white;" viewBox="-16 -16 702.34375 723.0" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><rect x="-16" y="-16" width="702.34375" height="723.0" fill="#ffffff"/><title id="chart-title-my-svg">BlaBla development workflow</title><desc id="chart-desc-my-svg">The orchestrator recovers relevant intent with status and explain, then opens a bounded task. The worker accepts, implements within scope, records focused evidence and lens assessments, challenges the record and hands back ready. An independent reviewer inspects the diff and evidence and records findings; corrections return through acceptance and renewed evidence. The orchestrator resolves findings, integrates, confirms owner records and closes when current, then runs finish. Optional expert advice enters only at observed eligible checkpoints and has no scope or gate authority.</desc><style>#my-svg{font-size:18px;fill:#0f172a;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#f8fafc;}#my-svg .error-text{fill:#070503;stroke:#070503;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#475569;stroke:#475569;}#my-svg .marker.cross{stroke:#4